services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seeker
      POSTGRES_PASSWORD: seeker
      POSTGRES_DB: seeker
    # Host port 55432 to avoid clashing with a local Postgres on 5432/5433.
    # Containers still reach the DB on the internal port 5432.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeker -d seeker"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://seeker:seeker@db:5432/seeker
      JWT_SECRET: dev-secret-change-me
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      OTP_PROVIDER: ${OTP_PROVIDER:-sandbox}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MPESA_BASE_URL: ${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      # SMTP_HOST intentionally unset: emails are logged instead of sent.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      # vite.config.js reads VITE_API_PROXY for the dev-server proxy target.
      # Inside this container ``localhost`` is the container itself, where
      # nothing listens — it has to be the backend service name, or every
      # /api request from the browser fails with ECONNREFUSED.
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  frontend_node_modules:
